<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ingresar | Gestión documental</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-slate-100 px-4 py-12 text-slate-900">
  <main class="mx-auto max-w-md rounded-2xl bg-white p-8 shadow-xl shadow-slate-900/10">
    <p class="text-sm font-semibold uppercase tracking-[0.2em] text-cyan-700">Portal seguro</p>
    <h1 class="mt-2 text-3xl font-bold tracking-tight">Gestión documental</h1>
    <p class="mt-3 text-slate-600">Ingresa para consultar y administrar documentos según tu rol.</p>
    <form id="login" class="mt-8 grid gap-5">
      <label class="grid gap-2 text-sm font-semibold">Usuario<input class="rounded-lg border border-slate-300 px-3 py-2.5 font-normal outline-none transition focus:border-cyan-700 focus:ring-2 focus:ring-cyan-700/20" name="username" autocomplete="username" required></label>
      <label class="grid gap-2 text-sm font-semibold">Contraseña<input class="rounded-lg border border-slate-300 px-3 py-2.5 font-normal outline-none transition focus:border-cyan-700 focus:ring-2 focus:ring-cyan-700/20" name="password" type="password" autocomplete="current-password" required></label>
      <button class="rounded-lg bg-cyan-800 px-4 py-2.5 font-semibold text-white transition hover:bg-cyan-900 focus:outline-none focus:ring-2 focus:ring-cyan-700 focus:ring-offset-2">Ingresar</button>
    </form>
    <p id="message" class="mt-4 min-h-6 text-sm" role="status"></p>
  </main>
  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
