<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Documentos | Gestión documental</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-slate-100 px-4 py-8 text-slate-900">
  <main class="mx-auto max-w-5xl rounded-2xl bg-white p-6 shadow-xl shadow-slate-900/10 sm:p-8">
    <header class="flex flex-col justify-between gap-4 border-b border-slate-200 pb-6 sm:flex-row sm:items-start">
      <div><p class="text-sm font-semibold uppercase tracking-[0.2em] text-cyan-700">Portal seguro</p><h1 class="mt-1 text-3xl font-bold tracking-tight">Documentos</h1><p id="identity" class="mt-2 text-slate-600"></p></div>
      <button id="logout" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-700 focus:ring-offset-2" type="button">Cerrar sesión</button>
    </header>
    <p id="message" class="mt-4 min-h-6 text-sm" role="status"></p>
    <form id="create" class="mt-4 grid gap-4 rounded-xl border border-slate-200 bg-slate-50 p-5 sm:grid-cols-2" hidden>
      <label class="grid gap-2 text-sm font-semibold">Folio<input class="rounded-lg border border-slate-300 bg-white px-3 py-2 font-normal outline-none focus:border-cyan-700 focus:ring-2 focus:ring-cyan-700/20" name="folio" required></label>
      <label class="grid gap-2 text-sm font-semibold">Nombre<input class="rounded-lg border border-slate-300 bg-white px-3 py-2 font-normal outline-none focus:border-cyan-700 focus:ring-2 focus:ring-cyan-700/20" name="name" required></label>
      <label class="grid gap-2 text-sm font-semibold">Tipo<input class="rounded-lg border border-slate-300 bg-white px-3 py-2 font-normal outline-none focus:border-cyan-700 focus:ring-2 focus:ring-cyan-700/20" name="document_type" required></label>
      <label class="grid gap-2 text-sm font-semibold">Estado<select class="rounded-lg border border-slate-300 bg-white px-3 py-2 font-normal outline-none focus:border-cyan-700 focus:ring-2 focus:ring-cyan-700/20" name="status"><option>PENDING_UPLOAD</option><option>ACTIVE</option><option>ARCHIVED</option></select></label>
      <button class="rounded-lg bg-cyan-800 px-4 py-2.5 font-semibold text-white transition hover:bg-cyan-900 focus:outline-none focus:ring-2 focus:ring-cyan-700 focus:ring-offset-2 sm:col-span-2">Crear documento</button>
    </form>
    <section class="mt-8" aria-labelledby="documents-title">
      <div class="flex flex-col justify-between gap-3 sm:flex-row sm:items-center"><div><h2 id="documents-title" class="text-xl font-bold">Inventario</h2><p class="text-sm text-slate-600">Documentos registrados en el sistema.</p></div><button id="refresh" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-700 focus:ring-offset-2" type="button">Actualizar lista</button></div>
      <div id="documents"></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
